<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Living Wallpaper — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e; color: #e0e0e0;
      padding: 24px; max-width: 480px;
    }
    h1 { font-size: 20px; margin-bottom: 16px; color: #fff; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #aaa; }
    input[type="range"] { width: 100%; }
    select, input[type="text"] {
      width: 100%; padding: 8px 12px; background: #16213e;
      border: 1px solid #333; border-radius: 4px; color: #e0e0e0;
    }
    button {
      padding: 8px 16px; background: #0f3460; border: none;
      border-radius: 4px; color: #fff; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #1a508b; }
    .drop-zone {
      border: 2px dashed #333; border-radius: 8px; padding: 32px;
      text-align: center; color: #666; margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .drop-zone.dragover { border-color: #0f3460; color: #0f3460; }
    .wallpaper-name { color: #4ecca3; font-weight: 500; }
    .wallpaper-error {
      color: #e74c3c; font-size: 13px; margin-bottom: 16px;
      padding: 8px 12px; background: #2d1b1b; border-radius: 4px;
      border: 1px solid #e74c3c; display: none;
    }
  </style>
</head>
<body>
  <h1>Living Wallpaper</h1>

  <div class="drop-zone" id="dropZone">
    Drop a video file here (MP4, WebM)
  </div>

  <div id="currentWallpaper" style="display:none; margin-bottom: 16px;">
    Current: <span class="wallpaper-name" id="wallpaperName"></span>
  </div>

  <div id="wallpaperError" class="wallpaper-error"></div>

  <div class="field">
    <label>Volume</label>
    <input type="range" id="volume" min="0" max="100" value="0">
  </div>

  <div class="field">
    <label>Speed</label>
    <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
  </div>

  <div class="field">
    <label>
      <input type="checkbox" id="pauseOnFullscreen" checked>
      Pause when app/game is fullscreen
    </label>
  </div>

  <div class="field">
    <label>
      <input type="checkbox" id="pauseOnBattery" checked>
      Pause on battery power
    </label>
  </div>

  <button id="apply">Apply</button>

  <script src="app.js"></script>
</body>
</html>
